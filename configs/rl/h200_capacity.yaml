# FCFS capacity sweep for the H200 1M setup: TraceLab (1M) at 12-40 agents and
# synthetic training sessions at 18-45 agents, to pick the light and the
# memory-pressured load levels. Engine settings as in h200_concurrency.yaml.
workloads:
- name: synthetic_random
  trace: synthetic:random
  arrivals: sessions
  num_requests: 200
  num_blocks: 56345
  weight: 1.0
  gap_metric: false
  simulation:
    max_tokens: 890000
    session_concurrency: 18
    session_warmup: 600
    max_think_time: 600
    load_range:
    - 0.8
    - 1.25
  backend: frontier
  frontier:
    preset: h200_nemotron_1m
    prediction_rounding_bits: 5
    enable_prefix_caching: true
